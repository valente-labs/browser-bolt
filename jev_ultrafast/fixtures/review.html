<!doctype html><title>Synthetic review fixture</title><main><h1>Create a travel note</h1><label>Title<input id="title"></label><label>Note<textarea id="note"></textarea></label><button id="review">Review note</button></main><script>
document.querySelector('#review').onclick=()=>{let t=document.querySelector('#title').value,n=document.querySelector('#note').value;if(!t||!n)return;let main=document.querySelector('main');main.replaceChildren();let h=document.createElement('h1');h.textContent='Review before saving';let p=document.createElement('p');p.textContent=t;let q=document.createElement('p');q.textContent=n;let b=document.createElement('button');b.id='confirm';b.textContent='Confirm save';b.onclick=()=>{h.textContent='Note saved';b.remove()};main.append(h,p,q,b)};
</script>
