<!doctype html><title>Synthetic preference fixture</title><main><h1>Choose a delivery speed</h1><label><input type="radio" name="speed" id="standard" value="Standard">Standard</label><label><input type="radio" name="speed" id="express" value="Express">Express</label><button id="confirm">Save preference</button></main><script>document.querySelector('#confirm').onclick=()=>{let choice=document.querySelector('input:checked');if(!choice)return;let main=document.querySelector('main');main.replaceChildren();let h=document.createElement('h1');h.textContent='Preference saved';let p=document.createElement('p');p.textContent=choice.value;main.append(h,p)};</script>
