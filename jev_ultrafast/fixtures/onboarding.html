<!doctype html><meta charset="utf-8"><title>Studio Demo onboarding</title>
<style>body{font:16px system-ui;background:#edf0f5;color:#202936}main{max-width:640px;margin:48px auto;padding:32px;background:white;border-radius:16px}label{display:block;padding:10px}input[type=text],textarea{display:block;width:90%;padding:12px}button{padding:12px;margin:12px 8px}</style>
<main><h1>Set up your profile</h1><p>Step 1 of 3. Synthetic local profile.</p><label>Display name<input id="name" type="text"></label><label>Short bio<textarea id="bio"></textarea></label><button id="next">Choose interests</button></main>
<script>
const main=document.querySelector('main'),profile={};
document.querySelector('#next').onclick=()=>{profile.name=document.querySelector('#name').value.trim();profile.bio=document.querySelector('#bio').value.trim();if(!profile.name||!profile.bio)return;main.innerHTML='<h1>Choose exactly two interests</h1><p>Step 2 of 3</p>';for(const interest of ['Design','Travel','Finance','Fitness']){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=interest;label.append(input,document.createTextNode(interest));main.append(label)}const button=document.createElement('button');button.textContent='Review profile';button.onclick=()=>{profile.interests=Array.from(main.querySelectorAll('input:checked')).map(e=>e.value);if(profile.interests.length!==2)return;main.replaceChildren();const h=document.createElement('h1');h.textContent='Review your profile';main.append(h);for(const value of [profile.name,profile.bio,profile.interests.join(', ')]){const p=document.createElement('p');p.textContent=value;main.append(p)}const save=document.createElement('button');save.textContent='Finish setup';save.onclick=()=>{h.textContent='Profile ready';save.remove()};main.append(save)};main.append(button)};
</script>
