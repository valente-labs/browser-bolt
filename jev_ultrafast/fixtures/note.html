<!doctype html><title>Synthetic note fixture</title><main><h1>Create a travel note</h1><label>Title<input id="title"></label><label>Note<textarea id="note"></textarea></label><button id="save" onclick="let title=document.querySelector('#title').value;let note=document.querySelector('#note').value;if(title&&note){document.querySelector('main').replaceChildren();let h=document.createElement('h1');h.textContent='Note saved';let p=document.createElement('p');p.textContent=title;let q=document.createElement('p');q.textContent=note;document.querySelector('main').append(h,p,q)}">Save note</button></main>
